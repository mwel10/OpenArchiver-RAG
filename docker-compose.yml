services:

  # ── Qdrant — vector database for semantic search ──────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.11.4
    container_name: qdrant
    restart: unless-stopped
    # Docker's default soft limit of 1024 is not enough once a second
    # collection of ~1M points exists. Qdrant then fails to flush segments
    # ("Too many open files", os error 24), refuses connections, and leaves
    # the collection in status "red".
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - qdrant_data:/qdrant/storage

  # ── RAG Backend — FastAPI with hybrid search + Claude AI ──────────────────────
  email-rag-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: email-rag-backend
    restart: unless-stopped
    depends_on:
      - qdrant
    environment:
      # OpenArchiver internal services — container names as shown in Docker
      MEILISEARCH_URL:        http://OpenArchiver-MEILI:7700
      MEILISEARCH_MASTER_KEY: YOUR_MEILI_MASTER_KEY_HERE
      DATABASE_URL:           postgresql://YOUR_PG_USER:YOUR_PG_PASSWORD@OpenArchiver-DB:5432/YOUR_PG_DB
      # Qdrant
      QDRANT_URL:             http://qdrant:6333
      # Storage — path where OpenArchiver stores .eml files (mounted read-only)
      STORAGE_ROOT:           /var/data/open-archiver
      # AI keys
      ANTHROPIC_API_KEY:      YOUR_ANTHROPIC_API_KEY_HERE
      OPENAI_API_KEY:         YOUR_OPENAI_API_KEY_HERE
    volumes:
      # Mount OpenArchiver's email storage read-only so the backend can read .eml files
      - /path/to/openarchiver/data:/var/data/open-archiver:ro
    # Localhost only. Tailscale Serve puts HTTPS in front and is reachable
    # from your tailnet alone. This used to be 0.0.0.0, which let anyone on
    # the LAN call the API without logging in.
    ports:
      - "127.0.0.1:8001:8001"

  # ── Web Frontend — Nginx serves the search UI ─────────────────────────────────
  email-rag-frontend:
    image: nginx:1.27-alpine
    container_name: email-rag-frontend
    restart: unless-stopped
    depends_on:
      - email-rag-backend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      # The whole directory: 00-host.conf holds your tailnet hostname.
      - ./nginx:/etc/nginx/conf.d:ro
    # Nginx needs to reach Authelia for the forward-auth check.
    networks: [default, auth]
    ports:
      - "127.0.0.1:8090:80"

volumes:
  qdrant_data:

# Join the existing OpenArchiver network so container hostnames resolve correctly.
# Change "openarchiver_default" to match your actual Docker network name.
# Find it with: docker network ls
networks:
  default:
    external: true
    name: openarchiver_default
  # The network your Authelia container runs on. The search app joins it only
  # to make the forward-auth call. Find it with:
  #   docker inspect <authelia-container> --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}'
  auth:
    external: true
    name: YOUR_AUTHELIA_NETWORK_HERE
