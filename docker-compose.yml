services:

  # ── Qdrant — vector database for semantic search ──────────────────────────────
  qdrant:
    # v1.11.4 had CVE-2026-25628 (HIGH): the /logger endpoint takes a
    # caller-supplied path, read access is enough, and log lines can land
    # in config/local.yaml, which overrides the config on restart. An API
    # key is not a mitigation for it. Fixed from 1.16 onwards: the
    # advisory names 1.15.6, which was never released.
    #
    # Upgrading from an older version: Qdrant does not support skipping
    # minor versions, not even on a single node, and downgrades are not
    # supported either. Step through the last patch of every minor, back
    # up first, and check the point count after each step. See README.
    image: qdrant/qdrant:v1.16.3
    container_name: qdrant
    restart: unless-stopped
    environment:
      # Without this, every container on the shared Docker network can
      # read and overwrite the vectors and their payloads. Empty means no
      # key, which is the previous behaviour.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    # Docker's default soft limit of 1024 is not enough once a second
    # collection of ~1M points exists. Qdrant then fails to flush segments
    # ("Too many open files", os error 24), refuses connections, and leaves
    # the collection in status "red".
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - qdrant_data:/qdrant/storage

  # ── RAG Backend — FastAPI with hybrid search + Claude AI ──────────────────────
  email-rag-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: email-rag-backend
    restart: unless-stopped
    depends_on:
      - qdrant
    # Waarden komen uit .env ernaast; zie .env.example. Inline waarden komen
    # terecht in `docker inspect`, in back-ups en in elke kopie van dit bestand.
    environment:
      # OpenArchiver internal services — container names as shown in Docker
      MEILISEARCH_URL:        http://OpenArchiver-MEILI:7700
      # A search-only key is all this app needs: it searches and never writes.
      # The master key can delete indexes and mint new keys, so handing it to a
      # search client is more authority than the job requires. It is no longer
      # required here, so a deployment can leave it out entirely; it still works
      # as a fallback for setups that have not created a search key yet.
      MEILISEARCH_API_KEY:    ${MEILISEARCH_API_KEY:-}
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-}
      # Shared with nginx; see nginx/backend-secret.conf. Empty means
      # no check, which is the previous behaviour.
      BACKEND_SHARED_SECRET:  ${BACKEND_SHARED_SECRET:-}
      DATABASE_URL:           ${DATABASE_URL}
      # Qdrant
      QDRANT_URL:             http://qdrant:6333
      QDRANT_API_KEY:         ${QDRANT_API_KEY:-}
      # Storage — path where OpenArchiver stores .eml files (mounted read-only)
      STORAGE_ROOT:           /var/data/open-archiver
      # AI keys
      ANTHROPIC_API_KEY:      ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY:         ${OPENAI_API_KEY}
    volumes:
      # Mount OpenArchiver's email storage read-only so the backend can read .eml files
      - ${OPENARCHIVER_DATA:?set OPENARCHIVER_DATA in .env}:/var/data/open-archiver:ro
    # Localhost only. Tailscale Serve puts HTTPS in front and is reachable
    # from your tailnet alone. This used to be 0.0.0.0, which let anyone on
    # the LAN call the API without logging in.
    ports:
      - "127.0.0.1:8001:8001"

  # ── Web Frontend — Nginx serves the search UI ─────────────────────────────────
  email-rag-frontend:
    # Stable branch. 1.27 was no longer a maintained branch: of the 26
    # advisories covering it, only two ever got a 1.27 fix, and everything
    # from 2026 is fixed in 1.28 or later only.
    image: nginx:1.30-alpine
    container_name: email-rag-frontend
    restart: unless-stopped
    depends_on:
      - email-rag-backend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      # The whole directory, so a variant can ship more than one .conf file.
      # Swap this for ./nginx/authelia to put a login in front; see
      # docker-compose.authelia.yml.
      - ./nginx/plain:/etc/nginx/conf.d:ro
      # One line that identifies nginx to the backend. Mounted outside
      # conf.d on purpose: anything in conf.d is included at the http
      # level, and proxy_set_header belongs inside the location.
      - ./nginx/backend-secret.conf:/etc/nginx/backend-secret.conf:ro
    ports:
      - "127.0.0.1:8090:80"

volumes:
  qdrant_data:

# Join the existing OpenArchiver network so container hostnames resolve correctly.
# Change "openarchiver_default" to match your actual Docker network name.
# Find it with: docker network ls
networks:
  default:
    external: true
    name: openarchiver_default
