# The UI and the API on one origin, with no authentication of its own.
#
# This is the default because it is the variant that needs nothing but Docker.
# It is safe only because docker-compose.yml binds both ports to 127.0.0.1, so
# nothing else on your network can reach it. The app has no login, and it sits
# in front of an entire personal mail archive and two API keys. Publishing it
# on 0.0.0.0 and leaving it at that is how this project shipped once; do not.
#
# To use it from another machine, either tunnel:
#     ssh -N -L 8090:127.0.0.1:8090 you@host
# or put something in front that authenticates. docker-compose.authelia.yml
# together with nginx/authelia/ is a worked example using Authelia behind
# Tailscale Serve.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Via a variable plus resolver, so nginx looks the name up per request. With
    # a literal name in proxy_pass it resolves at config load and refuses to
    # start whenever the backend happens to be down.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        set $backend http://email-rag-backend:8001;
        # With a variable in proxy_pass, nginx does not strip the location
        # prefix the way a literal proxy_pass with a trailing slash does: the
        # URI after the variable is used verbatim. Rewrite first, then pass the
        # result with no URI part, or every call reaches the backend as "/".
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # /search waits for an embedding, a vector search and an answer from
        # Claude. The 60s default is far too short for that.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
