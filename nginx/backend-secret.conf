# Shared secret between nginx and the backend.
#
# The backend listens on 127.0.0.1 of the host, but it also sits on the Docker
# network of your OpenArchiver stack, where every other container can reach it
# at http://email-rag-backend:8001 directly. Neither Authelia nor nginx's
# auth_request is in front of that path. This file closes it.
#
# To switch it on:
#   1. Generate a secret:  openssl rand -hex 32
#   2. Replace the comment below with (keep the quotes and the semicolon):
#        proxy_set_header X-Backend-Secret "your-secret-here";
#   3. Put the same value in .env as BACKEND_SHARED_SECRET
#   4. docker compose up -d
#
# Leaving this file as it is keeps the previous behaviour: no secret, no check.
# Do not commit your own secret back to the repository.
