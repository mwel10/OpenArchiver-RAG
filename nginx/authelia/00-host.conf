# The two values the Authelia variant needs, in one place.
#
# $public_host is the hostname the browser uses, not the one nginx sees.
# $app_prefix is the path the app is mounted on in front of nginx, with no
# trailing slash, or "" when it sits at the root. Authelia has to be told the
# URL as the browser knows it, and the proxy in front has usually stripped the
# prefix by the time nginx sees the request, so nginx cannot work it out.
map $host $public_host {
    default "YOUR_TAILNET_HOST_HERE";
}
map $host $app_prefix {
    default "/zoek";
}
