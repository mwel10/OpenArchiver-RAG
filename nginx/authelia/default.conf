# The UI and its API behind Authelia, as an opt-in alternative to nginx/plain.
#
# Use it with:
#     docker compose -f docker-compose.yml -f docker-compose.authelia.yml up -d
#
# Set $public_host and $app_prefix in 00-host.conf first. Nothing else in this
# file is site-specific.
#
# Nginx asks Authelia about every request through auth_request and redirects to
# the portal when there is no session, so the API is behind the same check as
# the page. Combined with the 127.0.0.1 bindings in docker-compose.yml, the only
# way in is whatever you put in front: a tailnet, a VPN, a reverse proxy.
#
# About $app_prefix: a proxy in front usually strips the mount path before nginx
# sees the request. Measured with Tailscale Serve mounted on /zoek: /zoek/
# arrives as /, /zoek/index.html as /index.html, and /zoek without a trailing
# slash also as /. Authelia needs the URL the browser used, so the prefix is put
# back here by hand. That last case is also why the page adds the missing slash
# itself (see frontend/index.html): by the time nginx sees the request, /zoek
# and /zoek/ are indistinguishable.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve upstream names per request via a variable. With a literal name in
    # proxy_pass, nginx resolves at config load and refuses to start whenever
    # Authelia happens to be down.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Authelia decides per request. No valid session yields a 401 here, and the
    # error_page below sends the visitor to the portal.
    location = /internal/authelia {
        internal;
        set $authelia http://authelia:9091;
        proxy_pass $authelia/auth/api/authz/auth-request;
        proxy_pass_request_body off;
        proxy_set_header Content-Length    "";
        proxy_set_header X-Original-Method $request_method;
        # Authelia needs the URL as the browser sees it, including the prefix
        # Tailscale Serve stripped before nginx got the request.
        proxy_set_header X-Original-URL    https://$public_host$app_prefix$request_uri;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $public_host;
        proxy_set_header X-Forwarded-Uri   $app_prefix$request_uri;
        proxy_set_header X-Forwarded-For   $remote_addr;
    }

    error_page 401 = @to_portal;
    location @to_portal {
        return 302 https://$public_host/auth/?rd=https://$public_host$app_prefix$request_uri;
    }

    # The API now runs through here, so it is as protected as the page itself.
    # It used to be callable directly on port 8001 by anyone on the LAN.
    location /api/ {
        auth_request /internal/authelia;
        set $backend http://email-rag-backend:8001;
        # With a variable in proxy_pass, nginx does not strip the location
        # prefix the way a literal proxy_pass with a trailing slash does: the
        # URI after the variable is used verbatim, so every call arrived at the
        # backend as "/" and came back 404. Rewrite first, then pass the result
        # with no URI part. The variable is still needed so nginx resolves the
        # name per request instead of refusing to start when the backend is down.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # /search waits for an embedding, a vector search and an answer from
        # Claude. The 60s default is far too short for that.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        auth_request /internal/authelia;
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
