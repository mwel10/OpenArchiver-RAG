# The search UI and its API, behind Authelia.
#
# Reachable at https://<tailnet-host>/zoek/ and nowhere else: both container
# ports bind to 127.0.0.1 in docker-compose.yml, so nothing on the LAN can
# reach them. Before this, the UI (8090) and the API (8001) were published on
# 0.0.0.0 with no authentication at all, in front of a personal mail archive.
#
# Verified against Tailscale 1.x: Serve strips the /zoek prefix before the
# request arrives here. Requesting /zoek/ reaches nginx as /, /zoek/index.html
# as /index.html, and /zoek without a trailing slash also as /. That last case
# is why the page adds the slash itself (see frontend/index.html): nginx cannot
# tell the difference, so it cannot put the prefix back for the API calls.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve upstream names per request via a variable. With a literal name in
    # proxy_pass, nginx resolves at config load and refuses to start whenever
    # Authelia happens to be down.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Authelia decides per request. No valid session yields a 401 here, and the
    # error_page below sends the visitor to the portal.
    location = /internal/authelia {
        internal;
        set $authelia http://authelia:9091;
        proxy_pass $authelia/auth/api/authz/auth-request;
        proxy_pass_request_body off;
        proxy_set_header Content-Length    "";
        proxy_set_header X-Original-Method $request_method;
        # Authelia needs the URL as the browser sees it, including the prefix
        # Tailscale Serve stripped before nginx got the request.
        proxy_set_header X-Original-URL    https://$tailnet_host/zoek$request_uri;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $tailnet_host;
        proxy_set_header X-Forwarded-Uri   /zoek$request_uri;
        proxy_set_header X-Forwarded-For   $remote_addr;
    }

    error_page 401 = @to_portal;
    location @to_portal {
        return 302 https://$tailnet_host/auth/?rd=https://$tailnet_host/zoek$request_uri;
    }

    # The API now runs through here, so it is as protected as the page itself.
    # It used to be callable directly on port 8001 by anyone on the LAN.
    location /api/ {
        auth_request /internal/authelia;
        set $backend http://email-rag-backend:8001;
        # With a variable in proxy_pass, nginx does not strip the location
        # prefix the way a literal proxy_pass with a trailing slash does: the
        # URI after the variable is used verbatim, so every call arrived at the
        # backend as "/" and came back 404. Rewrite first, then pass the result
        # with no URI part. The variable is still needed so nginx resolves the
        # name per request instead of refusing to start when the backend is down.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # /search waits for an embedding, a vector search and an answer from
        # Claude. The 60s default is far too short for that.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        auth_request /internal/authelia;
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
